default:
  image: docker:24.0.9
  services:
    - name: docker:24.0.9-dind
  before_script:
    - apk add bash curl
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - mv .secure_files/.env .env
    - docker info
    # Authenticate with the job token; it can push to this project's registry and never needs rotating.
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

variables:
  DOCKER_TLS_CERTDIR: ""

build:
  stage: build
  script:
    - docker compose build
    - docker push "$CI_REGISTRY_IMAGE/cygnet:latest"

deploy_docker_stage:
  stage: deploy
  variables:
    DOCKER_HOST: "tcp://130.58.218.21:2376"
  script:
    - docker stack deploy --with-registry-auth -c ./docker-compose.yml cygnet
